# ---------------------------------------------------------------
# PERFIL DE PRODUCAO (Render + Neon/PostgreSQL)
# ---------------------------------------------------------------

# Base de dados (valores vem das variaveis de ambiente do Render)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate cria/actualiza as tabelas
spring.jpa.hibernate.ddl-auto=update

# Porta atribuida pelo Render (8080 se correr localmente)
server.port=${PORT:8080}

# O Render serve o site por HTTPS atras de um proxy
server.forward-headers-strategy=native

# Cookie de sessao seguro
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# Administrador inicial: a senha TEM de vir do Render
# (sem a variavel SAPIENS_ADMIN_SENHA a aplicacao nao arranca)
sapiens.admin.senha=${SAPIENS_ADMIN_SENHA}

# Sem senha geral de testes
sapiens.dev.senha-geral=