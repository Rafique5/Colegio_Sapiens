# ---------------------------------------------------------------
# PERFIL DE PRODUCAO (Render + Neon/PostgreSQL)
# ---------------------------------------------------------------

# Base de dados (valores vem das variaveis de ambiente do Render)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate cria/actualiza as tabelas
spring.jpa.hibernate.ddl-auto=update

# Porta atribuida pelo Render (8080 se correr localmente)
server.port=${PORT:8080}

# O Render serve o site por HTTPS atras de um proxy
server.forward-headers-strategy=native

# Em producao, sem senha geral de testes
sapiens.dev.senha-geral=