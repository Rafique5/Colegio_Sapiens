# ---------------------------------------------------------------
# Configuração geral da aplicação Colegio Sapiens
# ---------------------------------------------------------------
spring.application.name=Colegio Sapiens
server.port=8080

# Encerramento automático da sessão após 30 minutos de inactividade
server.servlet.session.timeout=30m

# ---------------------------------------------------------------
# Base de dados
# Por omissão usa H2 em ficheiro (não precisa de instalar nada e gasta pouca memória).
# Os dados ficam na pasta ./dados
# ---------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./dados/colegio_sapiens
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---------------------------------------------------------------
# Alternativa: MySQL (comente as 4 linhas H2 acima e descomente estas 4).
# Depois de instalar o MySQL, corra base-de-dados/colegio_sapiens.sql (opcional:
# o Hibernate também cria as tabelas) e ponha a senha REAL do seu utilizador.
# ---------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/colegio_sapiens?createDatabaseIfNotExist=true&serverTimezone=Africa/Maputo&useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=A_SUA_SENHA_REAL

# Hibernate cria/actualiza as tabelas automaticamente (em produção usar "validate")
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Todo o acesso a dados ocorre dentro dos serviços (camada transaccional)
spring.jpa.open-in-view=false

# Poupa memória em desenvolvimento (o reinício automático mantém duas cópias das classes)
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ---------------------------------------------------------------
# CORS: origens do frontend separado (pasta "frontend") autorizadas a chamar a API.
# Use sempre "localhost" (nunca 127.0.0.1) para o cookie de sessão funcionar.
# ---------------------------------------------------------------
sapiens.cors.origens=http://localhost:5500,http://localhost:3000,http://localhost:5173,http://localhost:8081

# ---------------------------------------------------------------
# Conta do administrador inicial (criada apenas se ainda não existir)
# IMPORTANTE: altere a senha logo após o primeiro acesso
# ---------------------------------------------------------------
sapiens.admin.nome=Administrador do Sistema
sapiens.admin.email=admin@sapiens.co.mz
sapiens.admin.senha=Admin@12345
