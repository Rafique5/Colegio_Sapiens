# ---------------------------------------------------------------
# Configura\u00e7\u00e3o geral da aplica\u00e7\u00e3o Colegio Sapiens
# ---------------------------------------------------------------
spring.application.name=Colegio Sapiens
server.port=8080

# Ativa o perfil DEV (H2 local) por padr\u00e3o no computador da equipa
spring.profiles.active=dev

# Encerramento autom\u00e1tico da sess\u00e3o ap\u00f3s 30 minutos de inactividade
server.servlet.session.timeout=30m

# Hibernate configura\u00e7\u00f5es globais
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Poupa mem\u00f3ria em desenvolvimento
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ---------------------------------------------------------------
# CORS: origens autorizadas a chamar a API.
# NOTA: Em produ\u00e7\u00e3o, o Render/Vercel ser\u00e1 adicionado aqui!
# ---------------------------------------------------------------
sapiens.cors.origens=http://localhost:5500,http://localhost:3000,http://localhost:5173,http://localhost:8081

# ---------------------------------------------------------------
# Conta do administrador inicial
# ---------------------------------------------------------------
sapiens.admin.nome=Administrador do Sistema
sapiens.admin.email=admin@sapiens.co.mz
sapiens.admin.senha=Admin@12345

# ---------------------------------------------------------------
# S\u00d3 PARA DESENVOLVIMENTO
# ---------------------------------------------------------------
sapiens.dev.senha-geral=Teste@1234
