<!DOCTYPE html>
<html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colégio Sapiens - Criar conta</title><link rel="stylesheet" href="css/estilo.css"></head>
<body><div class="centro"><main class="card">
<div class="marca"><span class="cs">CS</span>Colégio Sapiens</div>
<h1>Criar conta</h1><p class="sub">Registe-se para aceder à plataforma.</p>
<form id="f" novalidate>
<label>Nome</label><input class="inp" id="nome" placeholder="Nome completo">
<label>Email</label><input class="inp" id="email" type="email" placeholder="nome@exemplo.com">
<label>Palavra-passe</label><input class="inp" id="s1" type="password">
<label>Confirmar palavra-passe</label><input class="inp" id="s2" type="password">
<p id="msg" class="erro" role="alert"></p>
<button class="btn esc" id="b">Criar conta</button></form>
<p class="rodape">Já tem conta? <a href="login.html">Entrar</a></p>
</main></div><script src="js/config.js"></script><script src="js/registo.js"></script></body></html>
